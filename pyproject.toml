[project]
name = "mcp-tce-pr"
version = "0.3.0"
description = "Servidor MCP independente para dados públicos do TCE-PR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastmcp>=3.2.3,<4", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7", "openpyxl>=3.1,<4", "lxml>=5,<7", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
navegador = ["playwright>=1.58,<2"]

[project.scripts]
mcp-tce-pr = "mcp_tce_pr.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tce_pr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
